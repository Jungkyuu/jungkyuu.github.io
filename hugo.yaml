  # About
  about:
    enable: true
    title: "About Me"
    content: |-
      I am an Honours BSc in Computer Science (Co-op) student at the University of Ottawa, holding an Honours Advanced Diploma in Computer Programming and Analysis from Seneca Polytechnic (GPA 3.6/4.0). I have hands-on experience developing full-stack web applications, containerized cloud microservices, and automated CI/CD pipelines.

      Backed by AWS and Microsoft Azure certifications, Linux security labs, and leadership experience from the Republic of Korea Army Signal Corps and competitive esports, I thrive in collaborative, fast-paced engineering environments. Fluent in Korean and English, with basic conversational Japanese.
    skills:
      enable: true
      title: "Technologies & Tools I work with:"
      items:
        - "Python"
        - "JavaScript"
        - "Next.js / React"
        - "Node.js / REST APIs"
        - "Java / C / C++"
        - "AWS (S3, DynamoDB)"
        - "Microsoft Azure"
        - "Docker & LocalStack"
        - "MongoDB & SQL"
        - "Linux / Bash"
        - "GitHub Actions & Jira"

  # Experience
  experience:
    enable: true
    title: "Experience"
    items:
      - company: "Hanyang Jokbal"
        jobs:
          - name: "Server & Closing Staff (Part-Time) — Ottawa, ON"
            date: "Sep 2026 - Present"
            info:
              content: "Balancing full-time Honours CS Co-op coursework with high-volume customer operations"
            content: |  
              - **Operations & Reliability:** Managed end-of-day closing procedures, cash reconciliation, and floor operations in a fast-paced environment while maintaining full-time Computer Science studies.
              - **Cross-Functional Teamwork:** Coordinated seamlessly with kitchen and front-of-house teams during peak hours to ensure accurate, timely service.

      - company: "Republic of Korea Army"
        jobs:
          - name: "Squad Leader & Tactical Communications Operator (Signal Corps)"
            date: "18 Months Service"
            info:
              content: "Field Network Infrastructure, Device Management & Squad Leadership"
            content: |
              - **Network & Device Administration:** Managed 30+ devices for 20+ officers, configuring IP/intranet infrastructure, isolating problematic endpoints, and escalating critical incidents.
              - **Team Leadership:** Supervised 12 soldiers during the final five months of service, assigning daily tasks and coordinating field communication operations under high-pressure conditions.

      - company: "DRX"
        jobs:
          - name: "Team Captain, Contracted Esports Player — League of Legends Team"
            date: "Jan 2020 - Dec 2020"
            info:
              content: "Competitive Strategy, Scrim Coordination & 5-Member Team Leadership"
            content: |
              - **Strategic Planning:** Facilitated team strategy discussions and structured daily practice schedules for a five-member contracted roster to prepare for competitive matches.
              - **External Coordination:** Proactively arranged practice matches (scrims) with other teams and aligned training objectives with coaching staff.
              - **Team Resilience:** Motivated teammates during challenging matches and performance slumps to maintain morale and focus on winning.

