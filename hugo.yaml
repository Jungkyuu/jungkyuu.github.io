baseURL: "https://jungkyuu.github.io/"
languageCode: "en-us"
title: "Jung Kyu Mok | CS Portfolio"
theme: "PaperMod"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

params:
  env: production
  defaultTheme: dark
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  profileMode:
    enabled: true
    title: "Jung Kyu Mok"
    subtitle: "Computer Science @ uOttawa | Software, Cloud & Cybersecurity"
    buttons:
      - name: About Me
        url: /about/
      - name: Projects & Write-ups
        url: /posts/
      - name: GitHub
        url: https://github.com/Jungkyuu

  socialIcons:
    - name: github
      url: "https://github.com/Jungkyuu"

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 5
    - identifier: posts
      name: Write-ups & Projects
      url: /posts/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20

outputs:
  home:
    - HTML
    - RSS
    - JSON